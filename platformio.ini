[env:frdm_kl25z]
platform = freescalekinetis
framework = zephyr
board = frdm_kl25z
platform_packages = platformio/framework-zephyr@~3.40200.0
monitor_speed = 115200
; Upload pela OpenSDA em modo mass-storage (protocolo padrao 'mbed' = copia o
; firmware.bin para o drive da placa). NAO usar 'cmsis-dap' aqui: ele exige o
; pyOCD, cuja dependencia PyYAML 5.4.1 nao compila no Python atual.
